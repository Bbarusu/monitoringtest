<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kdrop">
<title>Kdrop</title>
<!--
  A bandeja da Kisland vista do celular. Servida pelo proprio KInfo, na rede
  de casa: nada de fora, nenhuma fonte ou script baixado. Mesma paleta do
  painel (tema escuro), e a cor de destaque vem do PC.
-->
<style>
  :root { --acento: #3b82f6; --fundo: #15171c; --cartao: #1a1d23; --chip: #1d2026; --borda: #262a32;
          --trilho: #2a2e36; --texto: #e6e9ef; --fraco: #9aa3b2; --icone: #c4cad6; --info: #16233d; --infotexto: #8fbaff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto);
               font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, system-ui, sans-serif; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  header { padding: calc(22px + env(safe-area-inset-top)) 20px 0; display: flex; flex-direction: column; gap: 14px; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .icone { width: 44px; height: 44px; border-radius: 12px; background: var(--chip); display: flex;
           align-items: center; justify-content: center; flex: none; }
  .de { font-size: 12px; color: var(--fraco); }
  h1 { margin: 2px 0 0; font-size: 18px; font-weight: 600; }
  .pcs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .pc { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px;
        background: var(--cartao); border: 1px solid var(--borda); color: var(--texto); font-weight: 500; font-size: 13px;
        font-family: inherit; white-space: nowrap; text-decoration: none; }
  .pc.eu { border-color: var(--acento); background: var(--info); color: var(--infotexto); }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  main { flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .sec { font-size: 12px; color: var(--fraco); font-weight: 500; margin-top: 4px; }
  .arq { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
         background: var(--cartao); border: 1px solid var(--borda); }
  .arq.novo { border-color: var(--acento); background: var(--info); }
  .arq.escolhido { border-style: dashed; }
  .tipo { width: 36px; height: 36px; border-radius: 10px; background: #232730; display: flex; align-items: center;
          justify-content: center; font-size: 10px; font-weight: 600; color: var(--acento); flex: none; }
  .nome { flex: 1; min-width: 0; }
  .nome b { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nome span { display: block; font-size: 12px; color: var(--fraco); margin-top: 2px; }
  .baixar { height: 40px; padding: 0 14px; border-radius: 12px; background: var(--acento); color: #fff;
            font-weight: 600; font-size: 13px; line-height: 40px; font-family: inherit; text-decoration: none; flex: none; }
  .vazio { font-size: 13px; color: var(--fraco); padding: 6px 2px; line-height: 1.5; }
  .escolher { height: 52px; border-radius: 14px; background: transparent; border: 1.5px dashed #3a3f4a;
              color: var(--icone); font-weight: 500; font-size: 14px; font-family: inherit; display: flex; align-items: center;
              justify-content: center; cursor: pointer; }
  /* Escondido, mas nao com display:none: algumas versoes do Safari no iPhone
     nao abrem a escolha de arquivos por um campo com display:none. */
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  footer { padding: 14px 20px calc(26px + env(safe-area-inset-bottom)); border-top: 1px solid var(--borda);
           background: var(--fundo); position: sticky; bottom: 0; }
  .principal { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--acento); color: #fff;
               font-weight: 600; font-size: 15px; font-family: inherit; }
  .principal:disabled { opacity: .5; }
  .linha { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .secundario { height: 40px; padding: 0 14px; border-radius: 12px; background: transparent; border: 1px solid var(--trilho);
                color: var(--icone); font-weight: 500; font-size: 13px; font-family: inherit; }
  .anel { position: relative; width: 32px; height: 32px; flex: none; animation: respira 1.8s ease-in-out infinite alternate; }
  .anel::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--acento); opacity: .3; }
  .anel::after { content: ""; position: absolute; left: 6px; top: 6px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--acento); }
  @keyframes respira { from { transform: scale(.88); } to { transform: scale(1); } }
  .barra { height: 6px; border-radius: 3px; background: var(--trilho); margin-top: 8px; }
  .barra div { height: 6px; border-radius: 3px; background: var(--acento); width: 0; transition: width .2s; }
  .oculto { display: none !important; }
  .aviso { font-size: 13px; line-height: 1.5; color: var(--fraco); }
</style>
</head>
<body>
<header>
  <div class="marca">
    <span class="icone"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acento)" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l3-8h10l3 8v5a2 2 0 01-2 2H6a2 2 0 01-2-2zM4 13h5l1 2h4l1-2h5"/></svg></span>
    <div><div class="de">Kdrop · bandeja do</div><h1 id="titulo">…</h1></div>
  </div>
  <nav class="pcs" id="pcs" aria-label="PCs da casa"></nav>
</header>

<main>
  <div class="sec">Na bandeja</div>
  <div id="bandeja"></div>

  <div class="sec" style="margin-top:12px">Colocar na bandeja</div>
  <div id="escolhidos"></div>
  <label class="escolher" for="arquivos">+ Escolher fotos e arquivos</label>
  <input type="file" id="arquivos" multiple>
  <!-- Campos de escolhas anteriores: ficam guardados aqui, vivos. Veja o
       comentario em "Escolher e mandar". -->
  <div id="guardados" hidden></div>
</main>

<footer>
  <button class="principal" id="enviar" disabled>Escolha ao menos um arquivo</button>
  <div class="linha oculto" id="esperando">
    <span class="anel" aria-hidden="true"></span>
    <span style="flex:1">Esperando o PC aceitar…</span>
  </div>
  <div class="oculto" id="enviando">
    <div class="linha" style="justify-content:space-between;font-size:13px"><span>Colocando na bandeja</span><span id="porcentagem" class="de">0%</span></div>
    <div class="barra"><div id="progresso"></div></div>
  </div>
  <div class="linha oculto" id="resultado">
    <span class="aviso" id="mensagem" style="flex:1"></span>
    <button class="secundario" id="voltar">Ok</button>
  </div>
</footer>

<script>
(function () {
  "use strict";

  // Diagnóstico da galeria do iPhone (iOS 26 trava no ✓ desta página, e não
  // na /teste, servida igual): ?diag= desliga partes da página para achar a
  // culpada. "sem-consulta": pergunta ao PC uma vez só, ao abrir. "sem-foco":
  // não liga os avisos de foco e de escolha aberta. "campo": mostra o campo
  // comum do Safari no lugar do botão desenhado. Dá para juntar:
  // ?diag=sem-consulta,sem-foco.
  var diag = (function () {
    try { return (new URLSearchParams(location.search).get("diag") || "").split(","); }
    catch (e) { return []; }
  })();
  function semParte(nome) { return diag.indexOf(nome) >= 0; }

  // Quem e este celular, para o PC mostrar na Kisland e lembrar se a pessoa
  // marcar "aceitar sozinho". Guardado no navegador; sem isso, um por visita.
  var cliente;
  try {
    cliente = localStorage.getItem("kdrop-cliente");
    if (!cliente) { cliente = gerarId(); localStorage.setItem("kdrop-cliente", cliente); }
  } catch (e) { cliente = gerarId(); }

  function gerarId() {
    var s = "";
    for (var i = 0; i < 24; i++) s += Math.floor(Math.random() * 16).toString(16);
    return s;
  }

  var ua = navigator.userAgent;
  var nome = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Celular Android" : "Navegador";

  var $ = function (id) { return document.getElementById(id); };
  var escolhidos = [];
  var enviando = false;
  var novosVistos = {};
  // O que ja estava na bandeja quando a pagina abriu nao e novidade; o que
  // aparece depois (posto na bandeja no PC agora ha pouco) ganha "Acabou de
  // chegar" por 2 minutos.
  var conhecidos = null;
  var chegouEm = {};

  function tamanho(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return Math.round(b / 1024) + " KB";
    if (b < 1073741824) return (b / 1048576).toFixed(1).replace(".", ",") + " MB";
    return (b / 1073741824).toFixed(1).replace(".", ",") + " GB";
  }

  function tipo(n) {
    var i = n.lastIndexOf(".");
    return i > 0 ? n.slice(i + 1, i + 5).toUpperCase() : "ARQ";
  }

  function el(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  function linhaDeArquivo(nomeArq, detalhe, classe) {
    var linha = el("div", "arq" + (classe ? " " + classe : ""));
    linha.appendChild(el("span", "tipo", tipo(nomeArq)));
    var n = el("span", "nome");
    n.appendChild(el("b", null, nomeArq));
    n.appendChild(el("span", null, detalhe));
    linha.appendChild(n);
    return linha;
  }

  // ---- Estado do PC, perguntado a cada 2 s ---------------------------

  // Com a escolha de fotos aberta, a pagina fica quieta: nada de perguntar
  // ao PC nem redesenhar. O iPhone prepara as fotos escolhidas (baixa do
  // iCloud, converte HEIC para JPG) na hora do ✓, e uma pagina mexendo em si
  // mesma a cada 2 s so disputa com isso. Volta ao fechar a escolha.
  var escolhendo = false;
  var fimDaEscolha = 0;

  function comecarEscolha() {
    escolhendo = true;
    clearTimeout(fimDaEscolha);
    // Por garantia, se nenhum aviso de "fechou" chegar.
    fimDaEscolha = setTimeout(terminarEscolha, 10 * 60000);
  }

  function terminarEscolha() {
    if (!escolhendo) return;
    escolhendo = false;
    clearTimeout(fimDaEscolha);
    atualizar();
  }

  // So redesenha quando algo mudou (e a cada 30 s, para o "Acabou de chegar"
  // sumir na hora certa).
  var ultimoDesenho = "";

  function atualizar() {
    if (escolhendo) return;
    var url = "api/estado?cliente=" + encodeURIComponent(cliente) + "&nome=" + encodeURIComponent(nome);
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (e) {
        var chave = JSON.stringify(e) + Math.floor(Date.now() / 30000);
        if (chave === ultimoDesenho) return;
        ultimoDesenho = chave;
        desenhar(e);
      })
      .catch(function () { $("titulo").textContent = "PC sem resposta"; });
  }

  function desenhar(e) {
    if (e.acento) document.documentElement.style.setProperty("--acento", e.acento);
    $("titulo").textContent = e.nome;
    if (document.title !== "Kdrop · " + e.nome) document.title = "Kdrop · " + e.nome;

    var pcs = $("pcs");
    pcs.textContent = "";
    (e.pcs || []).forEach(function (pc) {
      var a = el(pc.eu ? "span" : "a", "pc" + (pc.eu ? " eu" : ""));
      if (!pc.eu) a.href = pc.endereco;
      a.appendChild(el("span", "ponto"));
      a.appendChild(document.createTextNode(pc.nome));
      pcs.appendChild(a);
    });

    (e.novos || []).forEach(function (id) { novosVistos[id] = true; });

    var lista = $("bandeja");
    lista.textContent = "";
    var itens = e.bandeja || [];
    if (!itens.length) lista.appendChild(el("div", "vazio", "A bandeja deste PC está vazia. Arraste os arquivos até a Kisland para aparecerem aqui."));
    var agora = Date.now();
    if (conhecidos === null) {
      conhecidos = {};
      itens.forEach(function (a) { conhecidos[a.id] = true; });
    }
    itens.forEach(function (a) {
      if (!conhecidos[a.id]) { conhecidos[a.id] = true; chegouEm[a.id] = agora; }
      var recente = chegouEm[a.id] && agora - chegouEm[a.id] < 120000;
      var medida = a.pasta ? "Pasta · baixa como .zip" : tamanho(a.tamanho);
      var detalhe = novosVistos[a.id] ? "Mandado para você · " + medida
                  : recente ? "Acabou de chegar · " + medida
                  : medida;
      var linha = linhaDeArquivo(a.nome, detalhe, novosVistos[a.id] || recente ? "novo" : "");
      var baixar = el("a", "baixar", "Baixar");
      baixar.href = "api/arquivo/" + a.id;
      baixar.setAttribute("download", a.nome);
      linha.appendChild(baixar);
      lista.appendChild(linha);
    });
  }

  // ---- Escolher e mandar ------------------------------------------------

  // Fotos da galeria do iPhone nao sao arquivos de verdade: o Safari cria
  // uma copia temporaria presa ao campo de escolha. Limpar o campo (para
  // escolher mais) apagava essas copias, e a foto nao existia mais na hora
  // de enviar — por isso arquivos iam e fotos nao. Agora:
  // - o campo usado nunca e limpo: fica guardado, e um campo novo toma o
  //   lugar dele para a proxima escolha;
  // - cada escolhido e lido para a memoria na hora (ate 100 MB), enquanto a
  //   copia do Safari certamente existe. Maior que isso, vai direto.
  var LIMITE_NA_MEMORIA = 100 * 1048576;
  var contagemDeCampos = 0;

  function ligarCampo(campo) {
    campo.addEventListener("change", function () {
      terminarEscolha();
      var arquivos = Array.prototype.slice.call(this.files || []);
      if (!arquivos.length) return;

      // Este campo fica como esta, guardado; um novo assume o lugar dele.
      var novo = document.createElement("input");
      novo.type = "file";
      novo.multiple = true;
      this.id = "arquivos-" + (++contagemDeCampos);
      this.parentNode.replaceChild(novo, this);
      novo.id = "arquivos";
      $("guardados").appendChild(this);
      ligarCampo(novo);

      arquivos.forEach(adicionar);
      desenharEscolhidos();
    });
  }
  ligarCampo($("arquivos"));

  if (!semParte("sem-foco")) {
    document.querySelector(".escolher").addEventListener("click", comecarEscolha);
    // Escolha cancelada (X) nao dispara "change": a pagina sabe que ela fechou
    // quando volta a ter o foco.
    window.addEventListener("focus", function () { setTimeout(terminarEscolha, 500); });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") setTimeout(terminarEscolha, 500);
    });
  }

  if (semParte("campo")) {
    var campoVisivel = document.createElement("style");
    campoVisivel.textContent = "input[type=file]#arquivos{position:static;width:auto;height:auto;opacity:1;pointer-events:auto;color:var(--texto)} .escolher{display:none}";
    document.head.appendChild(campoVisivel);
  }

  if (diag.length && diag[0]) {
    var aviso = document.createElement("div");
    aviso.className = "sec";
    aviso.textContent = "Diagnóstico: " + diag.join(", ");
    document.querySelector("main").insertBefore(aviso, document.querySelector("main").firstChild);
  }

  // O iPhone chama toda foto de "image.jpg". Com nomes repetidos, cada uma
  // ganha um nome com a data e a hora, e um numero.
  function nomeDaFoto(original, indice) {
    var ponto = original.lastIndexOf(".");
    var ext = ponto > 0 ? original.slice(ponto) : ".jpg";
    var d = new Date();
    var dois = function (n) { return (n < 10 ? "0" : "") + n; };
    return "Foto " + d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate()) + " " +
           dois(d.getHours()) + "." + dois(d.getMinutes()) + "." + dois(d.getSeconds()) +
           (indice > 1 ? " (" + indice + ")" : "") + ext;
  }

  function adicionar(f) {
    var nomeFinal = f.name || "arquivo";
    var generico = /^image\.(jpe?g|png|heic|heif|gif|webp)$/i.test(nomeFinal);
    var repetido = escolhidos.some(function (e) { return e.nome === nomeFinal; });
    if (generico || repetido) nomeFinal = nomeDaFoto(nomeFinal, escolhidos.length + 1);

    var item = { nome: nomeFinal, arquivo: f, tamanho: f.size, lendo: false, erro: null };
    escolhidos.push(item);

    if (f.size > 0 && f.size <= LIMITE_NA_MEMORIA && f.arrayBuffer) {
      item.lendo = true;
      f.arrayBuffer().then(function (dados) {
        item.arquivo = new Blob([dados], { type: f.type || "application/octet-stream" });
        item.tamanho = item.arquivo.size;
        item.lendo = false;
        desenharEscolhidos();
      }, function () {
        item.lendo = false;
        item.erro = "Não deu para ler esta foto. Escolha de novo.";
        desenharEscolhidos();
      });
    }
  }

  function desenharEscolhidos() {
    var lista = $("escolhidos");
    lista.textContent = "";
    escolhidos.forEach(function (e, i) {
      var detalhe = e.erro ? e.erro : e.lendo ? "Preparando…" : tamanho(e.tamanho);
      var linha = linhaDeArquivo(e.nome, detalhe, "escolhido");
      var tirar = el("button", "secundario", "Tirar");
      tirar.onclick = function () { if (!enviando) { escolhidos.splice(i, 1); desenharEscolhidos(); } };
      linha.appendChild(tirar);
      lista.appendChild(linha);
    });
    var n = escolhidos.length;
    var preparando = escolhidos.some(function (e) { return e.lendo; });
    var comErro = escolhidos.some(function (e) { return e.erro; });
    $("enviar").disabled = n === 0 || preparando || comErro;
    $("enviar").textContent = n === 0 ? "Escolha ao menos um arquivo"
                            : preparando ? "Preparando as fotos…"
                            : comErro ? "Tire o que não deu para ler"
                            : "Colocar " + n + (n === 1 ? " arquivo" : " arquivos") + " na bandeja";
  }

  function mostrar(qual) {
    ["enviar", "esperando", "enviando", "resultado"].forEach(function (id) {
      $(id).classList.toggle("oculto", id !== qual);
    });
  }

  function terminar(msg) {
    enviando = false;
    soltarTela();
    $("mensagem").textContent = msg;
    mostrar("resultado");
  }

  // Durante o envio a tela do celular fica acesa (Wake Lock, onde o navegador
  // deixa): com a tela apagada o iPhone congela a página e o envio para.
  var telaAcesa = null;
  function manterTela() {
    try {
      if (navigator.wakeLock && !telaAcesa)
        navigator.wakeLock.request("screen").then(function (l) {
          telaAcesa = l;
          l.addEventListener("release", function () { telaAcesa = null; });
        }, function () {});
    } catch (e) {}
  }
  function soltarTela() {
    try { if (telaAcesa) telaAcesa.release(); } catch (e) {}
    telaAcesa = null;
  }

  $("voltar").onclick = function () { mostrar("enviar"); desenharEscolhidos(); };

  $("enviar").onclick = function () {
    if (!escolhidos.length || enviando) return;
    enviando = true;
    mostrar("esperando");

    var corpo = { cliente: cliente, nome: nome, pc: false,
                  arquivos: escolhidos.map(function (e) { return { nome: e.nome, tamanho: e.tamanho }; }) };

    fetch("api/pedido", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) { if (!r.ok) throw new Error("pedido " + r.status); return r.json(); })
      .then(function (p) { inicioDaEspera = Date.now(); esperarAceite(p.pedido, p.estado); })
      .catch(function (e) { terminar("Não deu para falar com o PC (" + (e && e.message || "rede") + "). Ele está ligado e na mesma rede?"); });
  };

  var inicioDaEspera = 0;

  function esperarAceite(pedido, estado) {
    if (estado === "aceito") return mandar(pedido);
    if (estado === "recusado") return terminar("O PC recusou o envio.");
    if (estado === "expirado" || Date.now() - inicioDaEspera > 70000)
      return terminar("O PC não respondeu a tempo. A Kisland está ligada nele?");

    setTimeout(function () {
      fetch("api/pedido/" + pedido, { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (p) { esperarAceite(pedido, p.estado); })
        .catch(function () { esperarAceite(pedido, "esperando"); });
    }, 1000);
  }

  // ---- Envio em partes ---------------------------------------------------
  //
  // Cada arquivo vai em partes de 8 MB. Se a conexão cai (Wi-Fi oscilando,
  // tela apagando), a página pergunta ao PC quanto já chegou e continua dali,
  // tentando por alguns minutos antes de desistir. Um vídeo de 2 GB não
  // recomeça do zero por causa de um soluço da rede.

  var PARTE = 8 * 1048576;
  var TENTATIVAS = 40;
  var retomarAgora = null; // espera de reconexão em andamento, para a volta da tela

  function mandar(pedido) {
    mostrar("enviando");
    manterTela();
    var total = escolhidos.reduce(function (s, e) { return s + e.tamanho; }, 0) || 1;
    var feito = 0, i = 0;

    function progresso(bytes) {
      var p = Math.min(100, Math.round(bytes * 100 / total));
      $("progresso").style.width = p + "%";
      $("porcentagem").textContent = p + "%";
    }

    function proximoArquivo() {
      if (i >= escolhidos.length) {
        var n = escolhidos.length;
        escolhidos = [];
        desenharEscolhidos();
        atualizar();
        return terminar("Pronto! " + (n === 1 ? "O arquivo está" : "Os " + n + " arquivos estão") + " na bandeja do PC e em Downloads › Kdrop.");
      }
      enviarParte(escolhidos[i], 0, 0);
    }

    function enviarParte(f, pos, tentativas) {
      var ate = Math.min(pos + PARTE, f.tamanho);
      var ultima = ate >= f.tamanho;
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "api/enviar/" + pedido + "?arquivo=" + i + "&pos=" + pos + "&fim=" + (ultima ? 1 : 0) +
                       "&nome=" + encodeURIComponent(f.nome));
      xhr.timeout = 120000;
      xhr.upload.onprogress = function (ev) { progresso(feito + pos + ev.loaded); };
      xhr.onload = function () {
        var r = {};
        try { r = JSON.parse(xhr.responseText || "{}"); } catch (e) {}

        if (xhr.status === 200 && r.pronto) {
          feito += f.tamanho; i++;
          progresso(feito);
          return proximoArquivo();
        }
        if (xhr.status === 200) return enviarParte(f, r.gravados, 0);

        // Fora de ordem: o PC diz quanto já tem, e a próxima parte sai dali.
        if (xhr.status === 409 && typeof r.gravados === "number")
          return setTimeout(function () { enviarParte(f, r.gravados, tentativas + 1); }, 400);

        if (xhr.status === 403) return terminar("O PC encerrou este envio (" + (r.estado || "403") + "). Escolha os arquivos e mande de novo.");
        if (xhr.status === 413) return terminar(f.nome + " ficou maior do que o combinado com o PC. Escolha de novo e mande.");
        falhou(f, tentativas, "o PC respondeu " + xhr.status);
      };
      xhr.onerror = function () { falhou(f, tentativas, "a conexão caiu"); };
      xhr.ontimeout = function () { falhou(f, tentativas, "o PC demorou demais"); };
      xhr.send(f.arquivo.slice(pos, ate));
    }

    // Caiu: espera um pouco (cada vez mais, até 10 s), pergunta ao PC quanto
    // já chegou e continua dali.
    function falhou(f, tentativas, motivo) {
      if (tentativas + 1 > TENTATIVAS)
        return terminar("O envio de " + f.nome + " parou: " + motivo + ". Confira se o celular e o PC estão no mesmo Wi-Fi e mande de novo.");

      $("porcentagem").textContent = "Reconectando…";
      var espera = Math.min(10000, 1000 * Math.pow(2, Math.min(tentativas, 4)));
      var timer = setTimeout(sincronizar, espera);
      retomarAgora = function () { clearTimeout(timer); sincronizar(); };

      function sincronizar() {
        retomarAgora = null;
        fetch("api/enviar/" + pedido, { cache: "no-store" })
          .then(function (r) { if (r.status === 404) throw { fim: true }; return r.json(); })
          .then(function (e) {
            if (e.estado !== "aceito") return terminar("O PC encerrou este envio (" + e.estado + "). Escolha os arquivos e mande de novo.");
            var a = (e.arquivos || [])[i] || { gravados: 0 };
            if (a.pronto) { feito += f.tamanho; i++; return proximoArquivo(); }
            enviarParte(f, a.gravados || 0, tentativas + 1);
          })
          .catch(function (erro) {
            if (erro && erro.fim) return terminar("O PC não tem mais este envio. Escolha os arquivos e mande de novo.");
            falhou(f, tentativas + 1, "o PC não respondeu");
          });
      }
    }

    proximoArquivo();
  }

  // Voltou para a página (tela acesa de novo, ou saiu de outro app): se um
  // envio estava esperando para reconectar, tenta já, e reacende a tela.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !enviando) return;
    manterTela();
    if (retomarAgora) retomarAgora();
  });

  atualizar();
  if (!semParte("sem-consulta")) setInterval(atualizar, 2000);
})();
</script>
